<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Nexstepper — Nothing invented</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4f4f5;
      }
      #root {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #f4f4f5;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.6"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <!-- the app: scorecard, posting, Scout. Scenes 1-3 plus its exit. -->
      <div
        id="app"
        data-composition-id="app"
        data-composition-src="compositions/app.html"
        data-start="0"
        data-duration="21.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- the outro. -->
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="17.6"
        data-duration="4"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music bed: ducked under every narration line, thinned to silence
           under the wordmark. Lane times are clip-local (the bed starts at 0). -->
      <audio
        id="bgm"
        class="clip"
        data-start="0"
        data-duration="21.6"
        data-track-index="3"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.34},{"t":0.6,"v":0.34},{"t":0.7,"v":0.12},{"t":2.62,"v":0.12},{"t":2.75,"v":0.34},{"t":3.5,"v":0.34},{"t":3.6,"v":0.12},{"t":4.76,"v":0.12},{"t":4.9,"v":0.34},{"t":6,"v":0.34},{"t":6.1,"v":0.12},{"t":7.88,"v":0.12},{"t":8,"v":0.34},{"t":12,"v":0.34},{"t":12.1,"v":0.12},{"t":15.3,"v":0.12},{"t":15.4,"v":0.34},{"t":15.6,"v":0.34},{"t":15.7,"v":0.12},{"t":17.36,"v":0.12},{"t":17.5,"v":0.34},{"t":18.5,"v":0.34},{"t":18.6,"v":0.12},{"t":19.82,"v":0.12},{"t":19.95,"v":0.28},{"t":20.6,"v":0.28},{"t":21.5,"v":0}]}]}'
        src="assets/music/track.mp3"
      ></audio>

      <!-- narration -->
      <audio id="vo1" class="clip" data-start="0.7" data-track-index="4" data-volume="1" src="assets/voice/v1.wav"></audio>
      <audio id="vo2" class="clip" data-start="3.6" data-track-index="5" data-volume="1" src="assets/voice/v2.wav"></audio>
      <audio id="vo3" class="clip" data-start="6.1" data-track-index="6" data-volume="1" src="assets/voice/v3.wav"></audio>
      <audio id="vo4" class="clip" data-start="12.1" data-track-index="7" data-volume="1" src="assets/voice/v4.wav"></audio>
      <audio id="vo5" class="clip" data-start="15.7" data-track-index="8" data-volume="1" src="assets/voice/v5.wav"></audio>
      <audio id="vo6" class="clip" data-start="18.6" data-track-index="9" data-volume="1" src="assets/voice/v6.wav"></audio>

      <!-- seven bar fills, on the beat grid -->
      <audio id="sfx-bar1" class="clip" data-start="2.12" data-track-index="10" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar2" class="clip" data-start="2.65" data-track-index="11" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar3" class="clip" data-start="3.18" data-track-index="12" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar4" class="clip" data-start="3.7" data-track-index="13" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar5" class="clip" data-start="4.23" data-track-index="14" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar6" class="clip" data-start="4.75" data-track-index="15" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-bar7" class="clip" data-start="5.28" data-track-index="16" data-volume="0.22" src="assets/sfx/click-soft.mp3"></audio>

      <!-- one tick per missing-requirement chip -->
      <audio id="sfx-chip1" class="clip" data-start="7" data-track-index="17" data-volume="0.3" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-chip2" class="clip" data-start="7.65" data-track-index="18" data-volume="0.3" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-chip3" class="clip" data-start="8.3" data-track-index="19" data-volume="0.3" src="assets/sfx/click-soft.mp3"></audio>

      <!-- key ticks under Scout's typed line -->
      <audio id="sfx-key1" class="clip" data-start="12.75" data-track-index="20" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key2" class="clip" data-start="13.15" data-track-index="21" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key3" class="clip" data-start="13.55" data-track-index="22" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key4" class="clip" data-start="13.95" data-track-index="23" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key5" class="clip" data-start="14.35" data-track-index="24" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key6" class="clip" data-start="14.75" data-track-index="25" data-volume="0.16" src="assets/sfx/key-press.mp3"></audio>

      <!-- the chip lifting out; the final line -->
      <audio id="sfx-impact" class="clip" data-start="15.8" data-track-index="26" data-volume="0.5" src="assets/sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-chime" class="clip" data-start="18.55" data-track-index="27" data-volume="0.45" src="assets/sfx/chime.mp3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
