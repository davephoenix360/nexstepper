name: CI

# Gate every push to main + every PR. Run typecheck + unit tests.
# We don't run `next build` here yet — it would need a live Postgres
# (the root layout calls getUser() at request time, which the build
# also evaluates). When we add a CI DB (or a build-time DB bypass),
# add `pnpm build` as a third step.

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref when a new commit lands.
# Saves CI minutes when a push is followed by a fast follow-up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # `--frozen-lockfile` fails the build if package.json and
        # pnpm-lock.yaml drift — catches "I forgot to commit the lockfile"
        # before it ships.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # TODO when we have a CI DB or a build-time DB bypass:
      # - name: Build
      #   run: pnpm build
      #   env:
      #     POSTGRES_URL: postgres://test:test@localhost:5432/test
      #     BETTER_AUTH_SECRET: ci-only-secret
