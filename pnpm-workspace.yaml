allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# Pin `sharp` to 0.34.x.
#
# ## Why
#
# We do not use sharp. It arrives as a transitive dependency of
# `@huggingface/transformers` (for image processing we never do), and
# it was breaking production in a way that looked like nothing at all.
#
# `@vercel/nft` — Next.js's file tracer — carries a SPECIAL CASE for
# sharp, gated on `sharp/lib/index.js` existing. sharp 0.35 moved its
# entry point to `dist/index.cjs`, so on 0.35 the gate cannot match and
# **the libvips shared object is never traced into the serverless
# function**. The `.node` addon itself traces fine — which is why the
# failure shows up at `dlopen` time, not at `require` time:
#
#   Error: Could not load the "sharp" module using the linux-x64 runtime
#   ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.6: cannot open shared
#   object file: No such file or directory
#
# That killed the local embedding model in EVERY production score: the
# semantic half of the hybrid scorer silently contributed nothing, so
# every ATS Similarity was BM25-only — and every Role Fit was zero.
# Nothing errored; the scorecard said "Computed in 32 ms".
#
# sharp 0.34 keeps `lib/index.js`, so the tracer's special case fires
# and libvips is included. See vercel/next.js#96064 and
# lovell/sharp#4567 — this is a known Next 16.2 + Turbopack + pnpm +
# Vercel bug, fixed upstream in next@16.3.0.
#
# Until we are on next >= 16.3, this override is what makes the
# embedding model work in production. We do not call sharp's API
# ourselves, so the version carries no behavioural risk.
overrides:
  sharp: 0.34.5
